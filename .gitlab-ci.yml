# Checks every push and merge request: lint, types, tests and a production build.
image: node:22

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

check:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
