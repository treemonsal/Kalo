name: Kalo Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Browser checks for gestures, examples, navigation and small screens, against the dev server.
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          # A fresh runner has an empty local database: create the table before the dev server starts.
          npx wrangler d1 execute DB --file drizzle/0000_optimal_red_shift.sql --config dist/server/wrangler.json --local --persist-to .wrangler/state
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:5173 && break; sleep 1; done
          npm run e2e || { tail -n 60 dev.log; exit 1; }
